name: CI

on:
  pull_request:
    # develop is where day-to-day work lands; master gets it in batches. Both are gated —
    # a PR into develop that skipped CI would be an untested merge by default.
    branches: [master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and tests
        run: mvn verify -Dnet.bytebuddy.experimental=true
        env:
          GROQ_API_KEY: dummy-not-needed-in-tests
          GTD_VAULT_PATH: /tmp/vault
